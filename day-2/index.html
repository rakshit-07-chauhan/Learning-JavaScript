<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100" id="myBody">
   <div>
        <h1  class="text-3xl font-bold tracking-tight">Welcome Back</h1>
        <p class="text-zinc-400 mt-2">
        Sign in to continue to your account
        </p>
   </div>
    <div class="bg-gary-900/80 border border-zinc-800
                rounded-2xl p-6 sm:p-8 shadow-2xl">

      <form id="loginForm" class="space-y-5">

        <div>
          <label for="email"
                 class="block text-sm font-medium mb-2">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email"
            autocomplete="email"
            required
            class="w-full rounded-xl bg-zinc-950 border
                   border-zinc-700 px-4 py-3
                   outline-none transition
                   focus:border-violet-500
                   focus:ring-2 focus:ring-violet-500/20
                   placeholder:text-white"
          />
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="password"
                   class="text-sm font-medium">
              Password
            </label>

            <a href="#forgot"
               class="text-sm text-violet-400
                      hover:text-violet-300">
              Forgot password?
            </a>
          </div>

          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              class="w-full rounded-xl bg-zinc-950 border
                     border-zinc-700 px-4 py-3 pr-16
                     outline-none transition
                     focus:border-violet-500
                     focus:ring-2 focus:ring-violet-500/20
                     placeholder:text-white"
            />

            <button
              type="button"
              id="togglePassword"
              aria-label="Show password"
              class="absolute right-3 top-1/2
                     -translate-y-1/2 text-sm
                     text-violet-400 hover:text-violet-300"
            >
              Show
            </button>
          </div>
        </div>

</body>
</html>
