<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="min-h-screen bg-gray-300 flex items-center justify-center p-5">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                Student Details
            </h1>

            <p class="text-slate-400 mt-2 text-sm">
                Enter your information below
            </p>
        </div>

        <form id="studentForm" class="space-y-5">

            <div>
                <label for="name" class="block text-sm font-semibold text-slate-200 mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                    class="w-full bg-slate-800 text-white border border-slate-700 rounded-xl
                           px-4 py-3 outline-none placeholder:text-slate-500
                           focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30
                           transition duration-200">   
            </div>

            <div>
                <label for="age" class="block text-sm font-semibold text-slate-200 mb-2">
                    Age
                </label>

                <input type="number" id="age" placeholder="Enter your age" min="1" max="120"
                    required
                    class="w-full bg-slate-800 text-white border border-slate-700 rounded-xl
                           px-4 py-3 outline-none placeholder:text-slate-500
                           focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30
                           transition duration-200">    
            </div>

            <div>
                <label for="course" class="block text-sm font-semibold text-slate-200 mb-2">
                    Course
                </label>

                <input
                    type="text" id="course" placeholder="e.g. MCA, BCA, B.Tech"
                    required
                    class="w-full bg-slate-800 text-white border border-slate-700 rounded-xl
                           px-4 py-3 outline-none placeholder:text-slate-500
                           focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30
                           transition duration-200" >   
            </div>

            <button
                type="submit" class="w-full bg-orange-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-violet-950/40 transition duration-200
                       hover:-translate-y-0.5 active:translate-y-0"  > Show Student Data →  
            </button>

        </form>
        
  <script src="script.js"></script>
</body>
    
</html>
