<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
</head>
<body>
    <h1>Student Information Form</h1>
    <form id="studentForm">

        <label>Student Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Email:</label>
        <input type="email" id="eMail">
        <br><br>

        <label>Password:</label>
        <input type="password" id="password">
        <br><br>

        <label>Age:</label>
        <input type="number" id="age">
        <br><br>

        <label>Mobile:</label>
        <input type="number" id="mobile">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
        <br><br>

        <label>Skills</label>
        <input type="checkbox" name="skills" value="HTML">HTML
        <input type="checkbox" name="skills" value="JavaScript">JavaScript
        <input type="checkbox" name="skills" value="Java">Java
        <input type="checkbox" name="skills" value="CSS">CSS
        <br><br>

        <label>course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option value="MCA">MCA</option>
            <option value="BCA">BCA</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
        </select>
        <br><br>

        <label>Preferred Languages</label>
        <select id="language" multiple>
            <option value="Java">Java</option>
            <option value="JavaScript">JavaScript</option>
            <option value="C++">C++</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
        </select>
        <br><br>
        <label>Address</label>
        <textarea id="address" rows="7" cols="20"></textarea>
        <br><br>

        <label>Date Of Birth:</label>
        <input type="date" id="dob">
        <br><br>

        <label>Preferred Time:</label>
        <input type="time" id="preferredTime">
        <br><br>

        <input type="checkbox" id="agreement" >I accept the terms and conditions
        <br><br>

        <label>Programming Skill Level(1-10):</label>
        <input type="range" id="skillLevel" min="1" max="10" value="5">
        <br><br>

        <label>Favorite Color:</label>
        <input type="color" id="favoriteColor" value="#red">
        <br><br>

        <label>Upload Resume:</label>
        <input type="file" id="resume">
        <br><br>

        <label>Portfolio URL:</label>
        <input type="url" id="portfolio">
        <br><br>

        <input type="hidden" id="formType" value="studentRegistration">

        <label>Search Topic:</label>
        <input type="search" id="searchTopic">
        <br><br>

        <h3>Output</h3>
        <div class="output-section">

        <div id="welcomeMessage"></div>

        <div id="knownSkills"></div>

         </div>

    
        <button type="button" id="readFormBtn">
            Read Form Values
        </button>

        <!-- <button type="submit">Read From Values</button> -->
        <button type="reset">Reset</button>

    </form>
    <br>
    <button type="button" onclick="showData()">Show Information</button>

    
    <pre id="output"></pre>
    
    

    

    <script src="script.js"></script>
</body>
</html>
